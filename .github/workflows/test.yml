name: テスト

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ワークフローの検査に使う PyYAML を入れる
        run: pip install --quiet pyyaml
      - name: ユニットテスト
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: 投稿キューの検証
        run: python -m threads_bot validate
        env:
          PYTHONPATH: src
