name: 予算の見張り

# AI の使用量を月ごとに足し、想定予算の60%・80%を超えたら Issue を立てる（2026-10-19 から福井 $40・石川 $40・ぎふあいち $50 を別々に）。
# 代表の指示（2026-10-08）「想定予算の60％超えたら教えて」。予算・割合は 予算.json。
on:
  schedule:
    - cron: "30 12 * * *"   # 21:30 JST（翌日ぶんの作成のあと）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: budget-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 非公開の置き場から写す（odekake-data。鍵が無いあいだは何もしない）
        run: ./scripts/非公開.sh pull
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 使用量を足して、予算と比べる
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/予算.mjs
      - name: まとめをコミットする
        run: |
          ./scripts/commit_file.sh state/usage-summary.json "chore(usage): AI の使用量のまとめ"
