name: おでかけサイトの更新

# ネタ帳が予約画面や手で直されたとき、おでかけサイト（docs/ のトップ）のデータを作り直す。
# 毎朝の収集ぶんは neta-collect.yml の中で続けて行う（GITHUB_TOKEN のコミットでは
# このワークフローが起動しないため）。

on:
  push:
    branches: [main]
    paths:
      - "neta/ネタ帳.md"
      - "scripts/おでかけ.py"
      - "scripts/おでかけ_宿.py"
      - "scripts/宿.py"
  workflow_dispatch:
  # 今週末のページ・終わった催しは日付で変わるので、毎日作り直す（2026-10-20 SEO）。
  # GitHub の schedule は遅れることがあるが、AI を使わない作業なので遅れても困らない。0:05 JST
  schedule:
    - cron: "5 15 * * *"

permissions:
  contents: write

concurrency:
  group: odekake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: データを作り直す
        run: python scripts/おでかけ.py --thumbs
      - name: 宿のデータを作り直す
        run: python scripts/おでかけ_宿.py --images
      - name: コミットする
        run: |
          ./scripts/commit_file.sh docs/data.json "chore(odekake): ネタ帳からサイトのデータを更新"
          ./scripts/commit_file.sh docs/index.html "chore(odekake): 検索向けの静的な中身を更新"
          ./scripts/commit_file.sh docs/sitemap.xml "chore(odekake): サイトマップを更新"
          # 月別ページは増えたり消えたりするので、新しいファイルも差分に出るようにしてから
          if [ -d docs/month ]; then git add -N docs/month; fi
          ./scripts/commit_file.sh docs/month "chore(odekake): 月別ページを更新"
          # 今週末のページ・404（2026-10-20 SEO）
          ./scripts/commit_file.sh docs/weekend "chore(odekake): 今週末のページを更新"
          ./scripts/commit_file.sh docs/404.html "chore(odekake): 404 ページを更新"
          ./scripts/commit_file.sh docs/spot "chore(odekake): 新しいお店のページを更新"
          ./scripts/commit_file.sh docs/area "chore(odekake): 市町別のページを更新"
          ./scripts/commit_file.sh docs/contact "chore(odekake): 問い合わせのページを更新"
          ./scripts/commit_file.sh docs/hotels.json "chore(odekake): 宿のデータを更新"
