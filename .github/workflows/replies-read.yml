name: 返信を読む（手で動かす）

# 2026-10-13 運用部・石川担当（代表の依頼）。福井にも同じものを入れた（運用部・福井担当）。14時の問いかけ投稿への返信を集計するため、
# 返信の本文・いいね数・こちらの返信かどうかをジョブのログにだけ出す。
# リポジトリには書かない（代表「返信の本文そのものを外に出さない」）。ユーザー名は取らない。
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "返信を読みたい投稿の ID（数字）。何本かならカンマか空白で区切る"
        required: true

jobs:
  read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 非公開の置き場から写す（odekake-data。鍵が無いあいだは何もしない）
        run: ./scripts/非公開.sh pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 読む
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          POST_ID: ${{ inputs.post_id }}
        run: python "scripts/返信を読む.py"
      # 非公開の置き場があるときだけ、本文のファイルをそこへ置く（公開リポジトリには決してコミットしない）
      # 読めない投稿が1本あっても、読めた分は置く（always()。ジョブは赤のままにして失敗は見えるようにする。2026-10-14 運用部・石川担当）
      - name: 非公開の置き場に置く
        if: always() && env.DATA_REPO_TOKEN != ''
        run: |
          ./scripts/非公開.sh push 返信 "chore(返信): 返信を読んだ結果"
