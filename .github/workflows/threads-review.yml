name: Threads 日次レビュー

# マーケティング部・検証改善チーム。
# 昨日までの投稿の数字を取り、何が効いたかを判定して、翌日の生成指示（insights/learnings.md）を 1 つだけ更新する。
# 毎日 19:15 JST ごろ（20:00 の compose より前）に動かす。
# 外部 cron（cron-job.org）から threads-review で叩くのを本線にし、GitHub の schedule は保険。
on:
  repository_dispatch:
    types: [threads-review]
  schedule:
    - cron: "15 10 * * *"   # 19:15 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら結果を表示するだけでファイルを書かない"
        required: false
        default: "false"
      force:
        description: "true なら『今日はすでにレビュー済み』でも動かす"
        required: false
        default: "false"

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      PLATFORM: threads
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      # 同じ日の2回目以降は既定でスキップする。叩き直したいときだけ true
      FORCE: ${{ github.event.client_payload.force || github.event.inputs.force }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      REVIEW_HOLD_DAYS: ${{ vars.REVIEW_HOLD_DAYS }}
    steps:
      # 起動の時点ではなく、動き出した時点の main を取る（同じ時刻に2回起動されたとき、あとの回が前の回の投稿済み記録を見られるように。2026-10-17 cron-job.org の引っ越しで重なった）
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 非公開の置き場から写す（odekake-data。鍵が無いあいだは何もしない）
        run: ./scripts/非公開.sh pull
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 数字を取り、判定し、指示を更新する
        run: python scripts/review.py

      - name: 検証結果をコミットする
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(review): 日次レビュー $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((2 ** i))
          done
          exit 1

      - name: 使用量の記録をコミットする
        if: ${{ always() }}
        continue-on-error: true
        env:
          # 試し実行（dry_run）でも AI は呼ばれて料金がかかるので、使用量の記録だけは残す（2026-10-19 代表「おすすめの設定で」）
          DRY_RUN: "false"
        run: |
          ./scripts/commit_file.sh state/usage.jsonl "chore(usage): AI の使用量を記録"
