name: アフィリエイト投稿の検証

# 代表 10/9「アフィリエイト投稿を分析して、PDCAを回すサイクルを構築して」。
# 楽天トラベル・ふるさと納税の投稿の閲覧とリンクのクリックを集め、insights/アフィリの成績.md と
# insights/アフィリの学び.json（翌日ぶんの compose が読む）を書く。毎日 19:30 JST（20:00 の compose より前）。
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: 非公開の置き場から写す（odekake-data。鍵が無いあいだは何もしない）
        run: ./scripts/非公開.sh pull
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 集める
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python "scripts/アフィリの検証.py" > "$RUNNER_TEMP/out.txt" || { grep -E "^::" "$RUNNER_TEMP/out.txt"; exit 1; }; grep -E "^::" "$RUNNER_TEMP/out.txt" || true; echo "書き出しました（中身は公開のログに出しません）"
      - name: コミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/commit_file.sh "insights/アフィリの成績.md" "chore(affi): アフィリエイト投稿の成績を更新"
          ./scripts/commit_file.sh "insights/アフィリの学び.json" "chore(affi): アフィリエイトの学びを更新"
          ./scripts/commit_file.sh "insights/アフィリのクリック.jsonl" "chore(affi): リンクのクリックを記録"
