name: 残高チェック

# Anthropic の API がいま呼べるかを、いちばん小さいリクエストで確かめる。
# 残高が切れると 生成・収集・レビュー が全部止まり、キューが空のまま翌日になる。
# 20:00 の生成より前に気づけるよう、毎日 19:30 JST に回す。
#
# 結果は state/balance.json に書いてコミットする（2026-09-23 追加）。
# Cowork の定時タスクは Mac も GitHub API も使えないことがあるため、
# raw.githubusercontent.com から読めるファイルに落としておく。
on:
  repository_dispatch:
    types: [balance-check]
  schedule:
    - cron: "30 10 * * *"   # 19:30 JST
  workflow_dispatch:

permissions:
  contents: write

# ほかのワークフローと同じファイルを触るので、重ねて走らせない
concurrency:
  group: balance-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 非公開の置き場から写す（odekake-data。鍵が無いあいだは何もしない）
        run: ./scripts/非公開.sh pull
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: API が呼べるか確かめる
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_LABEL: ${{ github.repository }}
        run: node scripts/balance-check.mjs

      # 呼べなかったときこそ記録が要る。前のステップが落ちても必ず走らせる。
      - name: 結果をコミットする
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f state/balance.json ]; then echo "state/balance.json が無いので、コミットはしません。"; exit 0; fi
          ./scripts/commit_file.sh state/balance.json "chore(balance): $(TZ=Asia/Tokyo date '+%F %H:%M') の残高チェック結果"
