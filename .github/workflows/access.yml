name: アクセスの数字を読む

# 2026-10-13 代表「読めるようにして」。Google アナリティクス（おでかけ福井・石川・エキマエ）と
# Search Console・Cloudflare Web Analytics の数字を読み、要点を insights/アクセス/最新.md に残す。毎日 7:40 JST（8:27 の定例で状況ダッシュボードに入れるため、10/16 に 9:10 から早めた）と、手で起動したとき。
# 鍵は Secrets の GA_SA_KEY（読むだけのサービスアカウント）と CF_API_TOKEN・CF_ACCOUNT_ID。無いものは読まない。
on:
  # 外部の cron（cron-job.org）から叩く入口。GitHub の schedule は2時間ほど遅れる（10/17 は 7:40 の予定が 9:44）
  repository_dispatch:
    types: [access]
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:

jobs:
  access:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: 非公開の置き場から写す（odekake-data。鍵が無いあいだは何もしない）
        run: ./scripts/非公開.sh pull
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - name: 読む
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python "scripts/アクセス解析.py" > "$RUNNER_TEMP/out.txt" || { grep -E "^::" "$RUNNER_TEMP/out.txt"; exit 1; }; grep -E "^::" "$RUNNER_TEMP/out.txt" || true; echo "書き出しました（中身は公開のログに出しません）"
      - name: コミットする
        run: |
          ./scripts/commit_file.sh insights/アクセス "chore(insights): アクセスの要点を更新"
