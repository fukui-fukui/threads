name: Threads 翌日ぶんを作成

# 運用ボードとネタ帳を材料に、翌日ぶんの投稿 10 本を作ってキューに追加する。
# 外部 cron から毎日 20:00 (JST) に threads-compose で起動する想定。
on:
  repository_dispatch:
    types: [threads-compose]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら生成結果を表示するだけでキューに書き込まない"
        required: false
        default: "false"
      target_date:
        description: "作成対象日 YYYY-MM-DD（空なら翌日）"
        required: false
        default: ""

# 投稿の実行と重ならないよう、同じ枠で直列化する
concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      # 外部 cron からは client_payload.target_date で当日ぶんの作り直しができる
      TARGET_DATE: ${{ github.event.client_payload.target_date || github.event.inputs.target_date }}
      # ONLY_HOURS=15 のように渡すと、その枠だけを作る（中身を先に見たいとき用）
      ONLY_HOURS: ${{ github.event.client_payload.only_hours }}
      # SHIFT_HOURS="6=7" で、6:00 の枠の中身を 7:00 に出す（当日の作り直し用）
      SHIFT_HOURS: ${{ github.event.client_payload.shift_hours }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # ドキュメント ID は秘密ではないので Variables に置く
      BOARD_DOC_ID: ${{ vars.BOARD_DOC_ID }}
      NETA_DOC_ID: ${{ vars.NETA_DOC_ID }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      # queue の過去の版を読むので、履歴ごと取る（2026-09-29。同じ催しの繰り返しを見るため）
      # 起動の時点ではなく、動き出した時点の main を取る（同じ時刻に2回起動されたとき、あとの回が前の回の投稿済み記録を見られるように。2026-10-17 cron-job.org の引っ越しで重なった）
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: 非公開の置き場から写す（odekake-data。鍵が無いあいだは何もしない）
        run: ./scripts/非公開.sh pull

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 翌日ぶんの 10 本を作る
        id: make
        run: python scripts/compose.py

      # 残高切れなどで作れなかったとき、空いた枠を予備で埋める（API は使わない。2026-09-29）
      - name: 失敗したら予備で埋める
        if: ${{ failure() && steps.make.outcome == 'failure' }}
        env:
          USE_SPARE: "1"
        run: python scripts/compose.py

      # 楽天トラベルの40%OFF以上のクーポンがあれば、明日の 18:00 に1本だけ紹介を足す
      # （クーポンは x-yu__fukui-bot が週1回集める。2026-09-30 代表指示）
      - name: 大きいクーポンの紹介を足す
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          COUPON_HOUR: "18"
          COUPON_STYLE: "fukui"
          GITHUB_TOKEN: ${{ github.token }}
        run: python "scripts/クーポンの投稿.py"

      # 楽天トラベルの「【福井】◯◯な宿◯選」を、宿◯選の日（1日おき）の 15:00 に1本足す（AI は使わない）
      # 2026-10-12 代表「催し+宿と〇〇選を1日おきでいいですよ」。region.json の 使う.宿まとめ が true のときだけ動く
      - name: 宿まとめ（◯選）を足す
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ROUNDUP_HOUR: "15"
        run: python "scripts/宿まとめの投稿.py"

      - name: キューの形式を検証する
        id: validate
        if: ${{ always() }}
        env:
          PYTHONPATH: src
        run: python -m threads_bot validate

      - name: キューをコミットする
        if: ${{ always() && steps.validate.outcome == 'success' }}
        run: |
          set -euo pipefail
          # queue と予備を1つのコミットにする。別々にすると、片方が未コミットのまま
          # rebase できずに push が止まる（2026-09-30 に実際に起きた）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/queue.jsonl
          [ -f posts/予備.jsonl ] && git add posts/予備.jsonl
          [ -f neta/外した候補.md ] && git add neta/外した候補.md
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(queue): 翌日ぶんを追加"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((2 ** i))
          done
          exit 1

      - name: 使用量の記録をコミットする
        if: ${{ always() }}
        continue-on-error: true
        env:
          # 試し実行（dry_run）でも AI は呼ばれて料金がかかるので、使用量の記録だけは残す（2026-10-19 代表「おすすめの設定で」）
          DRY_RUN: "false"
        run: |
          ./scripts/commit_file.sh state/usage.jsonl "chore(usage): AI の使用量を記録"
