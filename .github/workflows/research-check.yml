name: リサーチの確認

# バズ投稿リサーチを自動でできるか（ほかの人の投稿のいいね数が API で取れるか）を確かめる（2026-11-01）。
# 読むだけで、投稿・返信はしない。
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "検索するキーワード"
        required: false
        default: "おでかけ 福井"
      profile:
        description: "公開投稿を読むアカウント（@なし）"
        required: false
        default: "antyan_beauty"
  push:
    branches: [claude/research-check]
    paths:
      - "scripts/リサーチの確認.py"
      - ".github/workflows/research-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 確かめる
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          KEYWORD: ${{ inputs.keyword || 'おでかけ 福井' }}
          PROFILE: ${{ inputs.profile || 'antyan_beauty' }}
        run: python "scripts/リサーチの確認.py"
